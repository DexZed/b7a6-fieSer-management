<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Failed Payment</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body>
    <section class="min-h-screen flex justify-center items-center bg-black">
      <div class="card w-96 bg-base-100 card-xl shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Your payment could not be processed</h2>
          <p>
            Your payment could not be processed successfully. Please try again.
          </p>
          <div class="card-actions">
            <button class="btn btn-primary" disabled>Go Home</button>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </body>
</html>
